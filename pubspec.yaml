name: nexora
description: "Nexora - Next-Gen Women Safety and Emergency Assistance Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0

  # Local Storage
  shared_preferences: ^2.3.5

  # Location & Maps
  geolocator: ^13.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Sensors (Accelerometer for shake detection)
  sensors_plus: ^6.0.1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # URL Launcher
  url_launcher: ^6.3.0

  # HTTP for API calls
  http: ^1.2.2

  # Permissions
  permission_handler: ^11.3.1

  # Voice Detection
  speech_to_text: ^7.0.0

  # Audio Recording — added back in Step 4
  # record: ^5.2.1

  # Camera — added back in Step 4
  # camera: ^0.11.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true