name: nexora
description: "Nexora - Next-Gen Women Safety and Emergency Assistance Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase Core
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.0

  # Local Storage (keeping for offline fallback)
  shared_preferences: ^2.3.5

  # Location & Maps
  geolocator: ^13.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Sensors (Accelerometer for shake detection)
  sensors_plus: ^6.0.1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # SMS / Calling (url_launcher opens SMS with pre-filled message)
  url_launcher: ^6.3.0

  # Audio Recording
#  record: ^5.2.1
#  record_android: ^1.5.2

  # Camera / Video
#  camera: ^0.11.4

  # Permissions Handler
  permission_handler: ^11.3.1

  # HTTP for API calls (Gemini AI chat)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true